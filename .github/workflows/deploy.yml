name: Deploy BMO API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy API to Homelab
    runs-on: self-hosted
    steps:
      - name: Deploy API and execute migrations
        run: |
          cd /home/calebe/homelab/bmo
          echo "==> Atualizando código do bmo-api..."
          git -C bmo-api pull origin main
          echo "==> Reconstruindo container bmo-api e executando migrations..."
          docker compose up -d --build --no-deps bmo-api bmo-receipt-extractor
          echo "==> Deploy concluído com sucesso!"
