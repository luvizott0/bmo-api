name: Deploy Homelab - BMO API

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Cloud (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir Nome das Imagens em Minúsculas
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "EXTRACTOR_IMAGE_NAME=${IMAGE_NAME}-extractor" >> $GITHUB_ENV

      - name: Compilar e Enviar Imagem bmo-api para o GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=bmo-api
          cache-to: type=gha,mode=max,scope=bmo-api

      - name: Compilar e Enviar Imagem bmo-receipt-extractor para o GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./receipt-extractor
          file: ./receipt-extractor/Dockerfile
          push: true
          tags: |
            ${{ env.EXTRACTOR_IMAGE_NAME }}:latest
            ${{ env.EXTRACTOR_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=bmo-extractor
          cache-to: type=gha,mode=max,scope=bmo-extractor

  deploy:
    name: Deploy Homelab (BMO API)
    needs: build-and-push
    runs-on: [self-hosted]
    steps:
      - name: Autenticar no GHCR no Runner Local
        run: |
          echo "🔑 Autenticando Docker no GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Backup da Imagem Atual (Rollback Safety)
        run: |
          if docker image inspect bmo-api:latest >/dev/null 2>&1; then
            echo "💾 Imagem atual encontrada. Criando tag bmo-api:rollback-backup..."
            docker tag bmo-api:latest bmo-api:rollback-backup
          else
            echo "ℹ️ Nenhuma imagem bmo-api:latest existente para backup prévio."
          fi

          if docker image inspect bmo-receipt-extractor:latest >/dev/null 2>&1; then
            docker tag bmo-receipt-extractor:latest bmo-receipt-extractor:rollback-backup
          fi

      - name: Baixar Novas Imagens do GHCR
        run: |
          BASE_IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          API_IMAGE="${BASE_IMAGE}:latest"
          EXTRACTOR_IMAGE="${BASE_IMAGE}-extractor:latest"

          echo "📥 Baixando imagem compilada na nuvem: $API_IMAGE..."
          docker pull "$API_IMAGE"
          docker tag "$API_IMAGE" bmo-api:latest

          echo "📥 Baixando imagem do extrator compilada na nuvem: $EXTRACTOR_IMAGE..."
          docker pull "$EXTRACTOR_IMAGE"
          docker tag "$EXTRACTOR_IMAGE" bmo-receipt-extractor:latest

      - name: Executar Deploy Zero-Downtime Blue-Green
        run: |
          TARGET_DIR="${{ vars.BMO_DIR }}"
          if [ -z "$TARGET_DIR" ]; then
            if [ -n "$BMO_DIR" ]; then
              TARGET_DIR="$BMO_DIR"
            elif [ -f "$HOME/homelab/bmo/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/homelab/bmo"
            elif [ -f "/opt/bmo/docker-compose.yml" ]; then
              TARGET_DIR="/opt/bmo"
            elif [ -f "$HOME/bmo/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/bmo"
            elif [ -f "../docker-compose.yml" ]; then
              TARGET_DIR=".."
            else
              TARGET_DIR="."
            fi
          fi

          if [ -d "$TARGET_DIR/bmo-api/.git" ]; then
            echo "🔄 Sincronizando código local em $TARGET_DIR/bmo-api..."
            git -C "$TARGET_DIR/bmo-api" pull origin main || true
          fi

          if [ -f "$TARGET_DIR/scripts/deploy-blue-green.sh" ]; then
            echo "🚀 Executando Deploy Zero-Downtime via scripts/deploy-blue-green.sh..."
            chmod +x "$TARGET_DIR/scripts/deploy-blue-green.sh"
            bash "$TARGET_DIR/scripts/deploy-blue-green.sh" api
          else
            echo "ℹ️ Modo legado: scripts/deploy-blue-green.sh não encontrado em $TARGET_DIR. Atualizando via docker compose..."
            if [ -f "$TARGET_DIR/docker-compose.yml" ]; then
              docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps bmo-api bmo-receipt-extractor
            else
              docker restart bmo-api bmo-receipt-extractor || echo "Contêineres não estavam em execução."
            fi

            echo "🩺 Verificando integridade no modo legado..."
            API_PORT=$(docker port bmo-api 8000/tcp 2>/dev/null | head -n 1 | awk -F: '{print $NF}' || echo "8081")
            API_PORT="${API_PORT:-8081}"
            HEALTHY=false
            for i in {1..15}; do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' bmo-api 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              if [ "$STATUS" = "running" ]; then
                if command -v curl >/dev/null 2>&1; then
                  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${API_PORT}/up" || echo "000")
                  if [ "$HTTP_CODE" = "200" ]; then
                    HEALTHY=true
                    break
                  fi
                fi
              fi
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "🚨 Falha na verificação de integridade! Executando rollback..."
              docker logs --tail 30 bmo-api || true
              if docker image inspect bmo-api:rollback-backup >/dev/null 2>&1; then
                docker tag bmo-api:rollback-backup bmo-api:latest
                docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps bmo-api
              fi
              exit 1
            fi
          fi

      - name: Limpeza de Imagens Antigas (Prune)
        if: always()
        run: |
          echo "🧹 Limpando imagens órfãs ou antigas..."
          docker image prune -f || true
